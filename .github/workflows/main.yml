
name: Build Quitlin Chat APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking project files"
          ls -la
          find . -maxdepth 3 -type f | sort | head -200

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android APK if Gradle project exists
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          elif [ -f ./app/build.gradle ] || [ -f ./app/build.gradle.kts ]; then
            echo "Gradle wrapper is missing; cannot safely build yet."
            exit 1
          else
            echo "No Android Gradle project found."
            echo "This repository needs Android project files before an APK can be built."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quitlin-chat-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
