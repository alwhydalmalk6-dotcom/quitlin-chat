
name: Build Quitlin Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Inspect and fix project paths
        shell: bash
        run: |
          set -e
          echo "Checking project files..."
          find . -maxdepth 7 -type f \( \
            -name "settings.gradle.kts" -o \
            -name "build.gradle.kts" -o \
            -name "AndroidManifest.xml" -o \
            -name "MainActivity.kt" \
          \) -print

          if [ -d "settings.gradle.kts" ] && [ -f "settings.gradle.kts/settings.gradle.kts" ]; then
            cp "settings.gradle.kts/settings.gradle.kts" /tmp/quitlin-settings.gradle.kts
            rm -rf settings.gradle.kts
            mv /tmp/quitlin-settings.gradle.kts settings.gradle.kts
          fi

          if [ -d "build.gradle.kts" ] && [ -f "build.gradle.kts/build.gradle.kts" ]; then
            cp "build.gradle.kts/build.gradle.kts" /tmp/quitlin-build.gradle.kts
            rm -rf build.gradle.kts
            mv /tmp/quitlin-build.gradle.kts build.gradle.kts
          fi

          if [ -d "app/src/main/AndroidManifest.xml" ] && [ -f "app/src/main/AndroidManifest.xml/app/src/main/AndroidManifest.xml" ]; then
            cp "app/src/main/AndroidManifest.xml/app/src/main/AndroidManifest.xml" /tmp/quitlin-manifest.xml
            rm -rf app/src/main/AndroidManifest.xml
            mv /tmp/quitlin-manifest.xml app/src/main/AndroidManifest.xml
          fi

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/quitlin/chat/MainActivity.kt

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quitlin-chat-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
