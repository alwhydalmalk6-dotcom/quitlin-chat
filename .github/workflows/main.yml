
name: Build Quitlin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Repair project files
        shell: bash
        run: |
          set -eu

          echo "=== Repairing Gradle files ==="

          repair_file() {
            target="$1"
            pattern="$2"

            if [ -f "$target" ]; then
              echo "OK: $target"
              return
            fi

            source_file="$(find "$target" -maxdepth 10 -type f -name "$pattern" -print -quit 2>/dev/null || true)"

            if [ -z "$source_file" ]; then
              echo "ERROR: Cannot find source for $target"
              find . -maxdepth 10 -print
              exit 1
            fi

            temp="${target}.recovered"
            cp "$source_file" "$temp"
            rm -rf "$target"
            mv "$temp" "$target"
            echo "Repaired: $target"
          }

          repair_file build.gradle.kts 'build.gradle.kts*'
          repair_file settings.gradle.kts 'settings.gradle.kts*'
          repair_file gradle.properties 'gradle.properties*'
          repair_file app/src/main/AndroidManifest.xml 'AndroidManifest.xml*'

          echo "=== Finding MainActivity ==="

          ACTIVITY="app/src/main/java/com/quitlin/chat/MainActivity.kt"

          if [ ! -f "$ACTIVITY" ]; then
            SOURCE="$(find app -type f -name 'MainActivity.kt*' ! -name '*.recovered' -print -quit)"

            if [ -z "$SOURCE" ]; then
              echo "ERROR: MainActivity source file not found"
              find app -maxdepth 12 -print
              exit 1
            fi

            mkdir -p "$(dirname "$ACTIVITY")"
            cp "$SOURCE" "$ACTIVITY"
          fi

          test -f app/build.gradle.kts
          test -f "$ACTIVITY"

          echo "=== MainActivity preview ==="
          head -n 12 "$ACTIVITY"

          echo "Project files are ready."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Quitlin-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
