
name: Build Quitlin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Inspect and repair files
        shell: bash
        run: |
          set -eu

          echo "=== All files related to MainActivity ==="
          find . -type f -iname '*MainActivity*' -print || true

          echo "=== All files inside app ==="
          find app -maxdepth 15 -print || true

          echo "=== Repair Gradle settings ==="
          repair_file() {
            target="$1"
            pattern="$2"

            if [ -f "$target" ]; then
              echo "OK: $target"
              return
            fi

            source_file="$(find "$target" -maxdepth 15 -type f -name "$pattern" -print -quit 2>/dev/null || true)"

            if [ -z "$source_file" ]; then
              echo "ERROR: Missing source for $target"
              exit 1
            fi

            cp "$source_file" "${target}.recovered"
            rm -rf "$target"
            mv "${target}.recovered" "$target"
            echo "Repaired: $target"
          }

          repair_file build.gradle.kts 'build.gradle.kts*'
          repair_file settings.gradle.kts 'settings.gradle.kts*'
          repair_file gradle.properties 'gradle.properties*'
          repair_file app/src/main/AndroidManifest.xml 'AndroidManifest.xml*'

          echo "=== Locate Kotlin source ==="
          ACTIVITY="app/src/main/java/com/quitlin/chat/MainActivity.kt"

          if [ ! -f "$ACTIVITY" ]; then
            SOURCE="$(find . -type f -name 'MainActivity.kt*' ! -name '*.recovered' ! -path './.git/*' -print -quit || true)"

            if [ -z "$SOURCE" ]; then
              echo "ERROR: No MainActivity source exists in this repository."
              echo "The Kotlin source must be restored or recreated."
              exit 1
            fi

            mkdir -p "$(dirname "$ACTIVITY")"
            cp "$SOURCE" "$ACTIVITY"
          fi

          test -f app/build.gradle.kts
          test -f "$ACTIVITY"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quitlin-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
