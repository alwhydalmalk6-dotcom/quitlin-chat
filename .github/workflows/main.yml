
name: Build Quitlin Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          
      - name: Diagnose project files
        shell: bash
        run: |
          echo "=== ROOT FILES ==="
          ls -la
          echo "=== GRADLE AND ANDROID FILES ==="
          find . -maxdepth 9 \( -name "settings.gradle.kts" -o -name "build.gradle.kts" -o -name "AndroidManifest.xml" -o -name "MainActivity.kt" \) -print
          echo "=== END DIAGNOSTICS ==="
