
name: Build Quitlin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Repair project files
        shell: bash
        run: |
          set -eu

          repair_file() {
            target="$1"
            pattern="$2"

            if [ -f "$target" ]; then
              echo "OK: $target"
              return
            fi

            if [ ! -d "$target" ]; then
              echo "ERROR: Missing $target"
              exit 1
            fi

            source_file="$(find "$target" -maxdepth 15 -type f -name "$pattern" -print -quit)"

            if [ -z "$source_file" ]; then
              echo "ERROR: Source not found inside $target"
              find "$target" -maxdepth 15 -print
              exit 1
            fi

            temp="${target}.recovered"
            cp "$source_file" "$temp"
            rm -rf "$target"
            mv "$temp" "$target"
            echo "Repaired: $target"
          }

          repair_file build.gradle.kts 'build.gradle.kts*'
          repair_file settings.gradle.kts 'settings.gradle.kts*'
          repair_file gradle.properties 'gradle.properties*'
          repair_file app/src/main/AndroidManifest.xml 'AndroidManifest.xml*'
          repair_file app/src/main/java/com/quitlin/chat/MainActivity.kt 'MainActivity.kt*'

          test -f app/build.gradle.kts

          echo "=== Verify repaired files ==="
          ls -l build.gradle.kts settings.gradle.kts gradle.properties
          ls -l app/src/main/AndroidManifest.xml
          ls -l app/src/main/java/com/quitlin/chat/MainActivity.kt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quitlin-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
