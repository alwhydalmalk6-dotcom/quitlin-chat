
name: Build Quitlin Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare project
        shell: bash
        run: |
          set -e
          cp settings.gradle.kts/settings.gradle.kts /tmp/settings.gradle.kts
          cp build.gradle.kts/build.gradle.kts /tmp/build.gradle.kts
          cp app/src/main/AndroidManifest.xml/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          rm -rf settings.gradle.kts build.gradle.kts app/src/main/AndroidManifest.xml
          cp /tmp/settings.gradle.kts ./settings.gradle.kts
          cp /tmp/build.gradle.kts ./build.gradle.kts
          cp /tmp/AndroidManifest.xml app/src/main/AndroidManifest.xml
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/quitlin/chat/MainActivity.kt

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quitlin-chat-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
